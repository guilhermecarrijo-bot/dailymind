<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://dailymind.onrender.com">
  <title>DailyMind - Cuide da sua mente</title>
  <link rel="icon" href="frontend/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #f0fdf4 0%, #faf5ff 100%);
      color: #1e293b;
      text-align: center;
    }

    main {
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(34, 197, 94, 0.15);
    }

    .emoji {
      font-size: 56px;
      line-height: 1;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 32px;
      background: linear-gradient(90deg, #22c55e, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 0 24px;
      color: #475569;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 12px;
      background: #22c55e;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    a:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>
  <main>
    <div class="emoji">🧠</div>
    <h1>DailyMind</h1>
    <p>Redirecionando para o aplicativo...</p>
    <a href="https://dailymind.onrender.com">Abrir DailyMind</a>
  </main>
  <script>
    window.location.replace('https://dailymind.onrender.com')
  </script>
</body>
</html>
