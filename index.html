<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://dailymind.onrender.com">
  <title>DailyMind - Cuide da sua mente</title>
  <link rel="icon" href="frontend/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: radial-gradient(40rem 26rem at 10% 0%, rgba(185, 205, 241, 0.5), transparent 70%),
        radial-gradient(34rem 24rem at 100% 100%, rgba(211, 192, 204, 0.45), transparent 70%), #F7F6FB;
      color: #2B2838;
      text-align: center;
    }

    main {
      max-width: 420px;
      padding: 40px 32px;
      border: 1px solid #E6E1EC;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(58, 52, 90, 0.08);
    }

    .logo {
      display: block;
      width: min(100%, 260px);
      height: auto;
      margin: 0 auto 20px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    p {
      margin: 0 0 24px;
      color: #575266;
    }

    a {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 999px;
      background: #5866A8;
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    a:hover {
      background: #4A5896;
    }

    a:focus-visible {
      outline: 3px solid #5866A8;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="frontend/img/logo-dailymind.png" alt="Daily Mind" width="960" height="241">
    <h1 class="sr-only">DailyMind</h1>
    <p id="texto-redirecionamento">Redirecionando para o aplicativo...</p>
    <a id="link-abir" href="https://dailymind.onrender.com">Abrir DailyMind</a>
  </main>
  <script>
    const textos = {
      'pt-BR': { titulo: 'DailyMind - Cuide da sua mente', redirecionando: 'Redirecionando para o aplicativo...', abrir: 'Abrir DailyMind' },
      en: { titulo: 'DailyMind - Care for your mind', redirecionando: 'Redirecting to the app...', abrir: 'Open DailyMind' },
      es: { titulo: 'DailyMind - Cuida tu mente', redirecionando: 'Redirigiendo a la aplicación...', abrir: 'Abrir DailyMind' }
    }
    const idiomas = ['pt-BR', 'en', 'es']
    let idioma = null
    try {
      const salvo = JSON.parse(localStorage.getItem('dailymind_configuracoes') || '{}')
      if (idiomas.includes(salvo.idioma)) {
        idioma = salvo.idioma
      }
    } catch (_) {}
    if (!idiomas.includes(idioma)) {
      const navegador = (navigator.language || '').toLowerCase()
      idioma = navegador.startsWith('es') ? 'es' : navegador.startsWith('en') ? 'en' : 'pt-BR'
    }
    const destino = new URL('https://dailymind.onrender.com')
    destino.searchParams.set('lang', idioma)
    const texto = textos[idioma]
    document.documentElement.lang = idioma
    document.title = texto.titulo
    document.getElementById('texto-redirecionamento').textContent = texto.redirecionando
    const link = document.getElementById('link-abir')
    link.textContent = texto.abrir
    link.href = destino.href
    const meta = document.querySelector('meta[http-equiv="refresh"]')
    if (meta) meta.content = `0; url=${destino.href}`
    window.location.replace(destino.href)
  </script>
</body>
</html>
